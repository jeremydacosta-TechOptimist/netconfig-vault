# device: core-sw-01
# vendor: cisco-ios
# site: porto-lab
# role: core-switch

!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname core-sw-01
!
boot-start-marker
boot-end-marker
!
logging buffered 16384 informational
logging host 203.0.113.20
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
!
ip cef
no ip domain-lookup
ip ssh version 2
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
vlan 10
 name MGMT
vlan 20
 name USERS
vlan 30
 name SERVERS
vlan 40
 name LAB
!
interface GigabitEthernet0/1
 description Uplink to edge-rtr-01
 switchport trunk allowed vlan 10,20,30,40
 switchport mode trunk
!
interface GigabitEthernet0/2
 description server-port
 switchport access vlan 30
 switchport mode access
 spanning-tree portfast
!
interface GigabitEthernet0/3
 description access-port
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast
!
interface GigabitEthernet0/4
 description unused
 shutdown
!
interface Vlan10
 description management
 ip address 198.51.100.11 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 198.51.100.1
!
ntp server 203.0.113.10
ntp server 203.0.113.11
!
snmp-server community NETLAB-RO RO
snmp-server location porto-lab
snmp-server contact netops@lab.example
!
ip http secure-server
!
banner motd ^C Authorised access only - lab device ^C
!
line con 0
 logging synchronous
 login local
 exec-timeout 10 0
!
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 login local
!
line vty 5 15
 exec-timeout 10 0
 transport input ssh
 login local
!
end
