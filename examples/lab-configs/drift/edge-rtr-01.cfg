# device: edge-rtr-01
# vendor: cisco-ios
# site: porto-lab
# role: edge-router

!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname edge-rtr-01
!
logging buffered 16384 informational
!
aaa new-model
aaa authentication login default group tacacs+ local
!
ip cef
no ip domain-lookup
ip ssh version 2
!
interface GigabitEthernet0/0
 description WAN uplink
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description lab LAN - user segment
 ip address 198.51.100.1 255.255.255.0
 ip access-group LAB-IN in
 no shutdown
!
interface GigabitEthernet0/2
 description unused
 shutdown
!
router ospf 10
 router-id 203.0.113.2
 network 198.51.100.0 0.0.0.255 area 0
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 203.0.113.30 255.255.255.255 203.0.113.1
!
ip access-list extended LAB-IN
 permit tcp any any eq 22
 permit udp 198.51.100.0 0.0.0.255 any eq 514
 deny ip any any log
!
ip access-list extended LAB-OUT
 permit ip any any
!
ntp server 203.0.113.10
ntp server 203.0.113.11
!
snmp-server community public RO
snmp-server location porto-lab
!
ip http secure-server
ip http server
!
banner motd ^C Authorised access only - lab device ^C
!
line con 0
 logging synchronous
 login local
 exec-timeout 10 0
!
line vty 0 4
 exec-timeout 10 0
 transport input all
 login local
!
end
