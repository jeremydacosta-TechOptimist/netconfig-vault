[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netconfig-vault"
version = "1.0.0"
description = "Offline snapshot vault, version history, diff and compliance auditing for network device configurations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jeremy da Costa", email = "357285436+jeremydacosta-TechOptimist@users.noreply.github.com" },
]
keywords = ["network", "configuration", "backup", "versioning", "compliance", "audit", "cisco", "aruba"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
netvault = "netvault.cli:main"

[project.urls]
Homepage = "https://github.com/jeremydacosta-TechOptimist/netconfig-vault"
Issues = "https://github.com/jeremydacosta-TechOptimist/netconfig-vault/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
